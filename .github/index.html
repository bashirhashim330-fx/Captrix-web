  <style id="captrix-account-picker-v2">
    /* Deployment fallback: the published self-contained index gets the same premium account picker. */
    .cx-native-account-enhanced{display:none!important}.cx-native-account-host .cx-pill{display:none!important}
    .cx-live-account-picker{position:relative;min-width:0;z-index:55}
    .cx-live-account-trigger{display:flex;align-items:center;gap:10px;min-width:0;width:min(520px,78vw);height:44px;padding:6px 10px 6px 8px;border:1px solid var(--cx-line-1);border-radius:15px 5px 15px 5px;background:linear-gradient(135deg,var(--cx-fill-1),var(--cx-fill-2));color:var(--cx-ink);box-shadow:inset 0 1px 0 var(--cx-rim-1),0 8px 24px -18px rgba(0,0,0,.7);font-family:Inter,sans-serif;cursor:pointer}
    .cx-live-account-trigger:hover,.cx-live-account-picker.is-open .cx-live-account-trigger{border-color:rgba(17,214,255,.5);box-shadow:inset 0 1px 0 var(--cx-rim-1),0 0 0 3px rgba(17,214,255,.07),0 12px 28px -20px rgba(17,214,255,.55)}
    .cx-live-account-mark{width:30px;height:30px;display:grid;place-items:center;flex:none;border-radius:10px 4px 10px 4px;background:rgba(17,214,255,.1);color:var(--cx-cyan);border:1px solid rgba(17,214,255,.22);font-size:14px}
    .cx-live-account-copy{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;overflow:hidden}
    .cx-live-account-label{font:700 8px/1 'JetBrains Mono',monospace;letter-spacing:.14em;color:var(--cx-mute)}
    .cx-live-account-value{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 11px/1.35 'JetBrains Mono',monospace;color:var(--cx-ink)}
    .cx-live-account-value span{color:var(--cx-mute);font-weight:500}
    .cx-live-account-chevron{margin-left:auto;color:var(--cx-mute);font-size:14px;transition:transform .2s}
    .cx-live-account-picker.is-open .cx-live-account-chevron{transform:rotate(180deg)}
    .cx-live-account-pop{position:absolute;left:0;top:calc(100% + 10px);z-index:999;width:min(430px,calc(100vw - 24px));overflow:hidden;border-radius:20px 6px 20px 6px;background:linear-gradient(135deg,var(--cx-fill-3),var(--cx-fill-2));border:1px solid var(--cx-line-3);box-shadow:inset 0 1px 0 var(--cx-rim-3),var(--cx-shadow-3);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);animation:cxLiveAcctPop .24s cubic-bezier(.22,1,.36,1)}
    .cx-live-account-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border-bottom:1px solid var(--cx-line-1)}
    .cx-live-account-eyebrow{display:block;font:700 8px/1 'JetBrains Mono',monospace;letter-spacing:.16em;color:var(--cx-cyan)}
    .cx-live-account-title{margin-top:5px;font:700 15px/1.2 Sora,sans-serif;color:var(--cx-ink)}
    .cx-live-account-count{font:700 8px/1 'JetBrains Mono',monospace;color:var(--cx-mute);padding:7px 8px;border:1px solid var(--cx-line-1);border-radius:999px;white-space:nowrap}
    .cx-live-account-list{padding:8px;display:grid;gap:6px}
    .cx-live-account-option{width:100%;display:flex;align-items:center;gap:10px;padding:11px 10px;text-align:left;border:1px solid transparent;border-radius:13px 5px 13px 5px;background:transparent;color:var(--cx-ink);cursor:pointer}
    .cx-live-account-option:hover{background:var(--cx-fill-1);border-color:var(--cx-line-1)}
    .cx-live-account-option.selected{background:linear-gradient(100deg,rgba(17,214,255,.11),rgba(20,120,255,.06));border-color:rgba(17,214,255,.3);box-shadow:inset 2px 0 0 var(--cx-cyan)}
    .cx-live-account-option-icon{width:32px;height:32px;display:grid;place-items:center;flex:none;border-radius:9px 3px 9px 3px;background:var(--cx-inset);border:1px solid var(--cx-line-1);color:var(--cx-mute)}
    .cx-live-account-option.selected .cx-live-account-option-icon{color:var(--cx-cyan);background:rgba(17,214,255,.12);border-color:rgba(17,214,255,.28)}
    .cx-live-account-option-body{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
    .cx-live-account-option-id{font:700 11px/1.25 'JetBrains Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cx-live-account-option-meta{font:500 9px/1.2 'JetBrains Mono',monospace;color:var(--cx-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cx-live-account-option-size{font:700 11px/1 'JetBrains Mono',monospace;color:var(--cx-cyan);white-space:nowrap}
    .cx-live-account-foot{padding:10px 14px 12px;border-top:1px solid var(--cx-line-1);font:500 8px/1.35 'JetBrains Mono',monospace;color:var(--cx-mute)}
    .cx-live-account-scrim{position:fixed;inset:0;z-index:998;background:rgba(4,8,12,.54);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
    @keyframes cxLiveAcctPop{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}

      .cx-live-account-trigger{width:min(230px,58vw);height:40px}
      .cx-live-account-pop{position:fixed;left:12px;right:12px;bottom:calc(62px + env(safe-area-inset-bottom) + 12px);top:auto;width:auto;max-width:none;border-radius:22px 6px 22px 6px}
      .cx-live-account-pop::before{content:"";display:block;width:42px;height:4px;border-radius:999px;background:var(--cx-line-1);margin:9px auto 0}
      .cx-live-account-head{padding-top:13px}
    }
    @media(max-width:430px){.cx-live-account-trigger{width:min(178px,50vw)}.cx-live-account-mark{display:none}}
    @media(prefers-reduced-motion:reduce){.cx-live-account-pop{animation:none}.cx-live-account-chevron{transition:none}}
  </style>
  <script>
    (function () {
      var mounted = new WeakSet();
      var observer;

      function closeAll() {
        document.querySelectorAll('.cx-live-account-picker.is-open').forEach(function (root) {
          root.classList.remove('is-open');
          var trigger = root.querySelector('.cx-live-account-trigger');
          if (trigger) trigger.setAttribute('aria-expanded', 'false');
        });
        // On mobile the popup is mounted directly under <body>, not inside the picker.
        // Remove every live popup globally so it can never remain stuck open.
        document.querySelectorAll('.cx-live-account-pop').forEach(function (pop) { pop.remove(); });
        document.querySelectorAll('.cx-live-account-scrim').forEach(function (scrim) { scrim.remove(); });
      }

      function syncVisuals(value) {
        document.querySelectorAll('.cx-live-account-picker').forEach(function (picker) {
          var select = picker.__cxSelect;
          if (!select) return;
          var opt = Array.prototype.find.call(select.options, function (o) { return o.value === value; });
          if (!opt) return;
          var triggerValue = picker.querySelector('.cx-live-account-value');
          if (triggerValue) {
            var parts = opt.textContent.split(' — ');
            triggerValue.textContent = parts[0] || opt.textContent;
            if (parts[1]) {
              var sub = document.createElement('span');
              sub.textContent = ' · ' + parts[1];
              triggerValue.appendChild(sub);
            }
          }
        });

        // The mobile sheet lives under <body>, so update its options globally too.
        document.querySelectorAll('.cx-live-account-option').forEach(function (button) {
          var selected = button.dataset.accountValue === value;
          button.classList.toggle('selected', selected);
          var icon = button.querySelector('.cx-live-account-option-icon');
          if (icon) icon.textContent = selected ? '✓' : '◈';
          button.setAttribute('aria-selected', selected ? 'true' : 'false');
        });
      }

      function setSelectValue(select, value) {
        var setter = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');
        if (setter && setter.set) setter.set.call(select, value);
        else select.value = value;
      }

      function choose(value) {
        var selects = Array.prototype.slice.call(document.querySelectorAll('select[aria-label="Active account"]'));
        if (!selects.length) return;

        var primary = selects[0];
        setSelectValue(primary, value);
        primary.dispatchEvent(new Event('input', { bubbles: true }));
        primary.dispatchEvent(new Event('change', { bubbles: true }));

        // Keep the mirrored desktop/mobile select in sync without firing a second React update.
        selects.slice(1).forEach(function (select) { setSelectValue(select, value); });
        syncVisuals(value);

        // React updates the controlled select on the next render. Close after that render so
        // the popup never gets stuck open and the newly selected account remains visible.
        window.requestAnimationFrame(function () {
          syncVisuals(value);
          closeAll();
        });
      }

      function buildPopup(picker, select) {
        var pop = document.createElement('div');
        pop.className = 'cx-live-account-pop';
        pop.setAttribute('role', 'dialog');
        pop.setAttribute('aria-label', 'Choose active account');

        var head = document.createElement('div');
        head.className = 'cx-live-account-head';
        var hcopy = document.createElement('div');
        hcopy.innerHTML = '<span class="cx-live-account-eyebrow">TRADING ACCOUNTS</span><div class="cx-live-account-title">Switch account</div>';
        var count = document.createElement('span');
        count.className = 'cx-live-account-count';
        count.textContent = select.options.length + ' ACTIVE';
        head.append(hcopy, count);
        pop.appendChild(head);

        var list = document.createElement('div');
        list.className = 'cx-live-account-list';
        Array.prototype.forEach.call(select.options, function (opt) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'cx-live-account-option' + (opt.value === select.value ? ' selected' : '');
          button.dataset.accountValue = opt.value;
          button.setAttribute('aria-selected', opt.value === select.value ? 'true' : 'false');

          var icon = document.createElement('span');
          icon.className = 'cx-live-account-option-icon';
          icon.textContent = opt.value === select.value ? '✓' : '◈';

          var body = document.createElement('span');
          body.className = 'cx-live-account-option-body';
          var parts = opt.textContent.split(' — ');
          var id = document.createElement('span');
          id.className = 'cx-live-account-option-id';
          id.textContent = parts[0] || opt.textContent;
          var meta = document.createElement('span');
          meta.className = 'cx-live-account-option-meta';
          meta.textContent = parts[1] || '';
          body.append(id, meta);

          var size = document.createElement('span');
          size.className = 'cx-live-account-option-size';
          var match = (parts[1] || '').match(/\$(\d+(?:,\d+)?K?)/);
          size.textContent = match ? '$' + match[1] : '';

          button.append(icon, body, size);
          button.addEventListener('click', function (event) {
            event.preventDefault();
            event.stopPropagation();
            choose(opt.value);
          });
          list.appendChild(button);
        });
        pop.appendChild(list);

        var foot = document.createElement('div');
        foot.className = 'cx-live-account-foot';
        foot.textContent = 'Account metrics update instantly after switching.';
        pop.appendChild(foot);
        return pop;
      }

      function open(picker, trigger, select) {
        closeAll();
        picker.classList.add('is-open');
        trigger.setAttribute('aria-expanded', 'true');

        var scrim = document.createElement('div');
        scrim.className = 'cx-live-account-scrim';
        if (window.innerWidth > 899) scrim.style.display = 'none';
        scrim.addEventListener('click', closeAll);
        document.body.appendChild(scrim);

        var pop = buildPopup(picker, select);
        if (window.innerWidth > 899) picker.appendChild(pop);
        else document.body.appendChild(pop);
      }

      function mount() {
        var selects = Array.prototype.slice.call(document.querySelectorAll('select[aria-label="Active account"]'));
        selects.forEach(function (select) {
          if (mounted.has(select)) return;
          mounted.add(select);
          select.dataset.cxEnhanced = '1';
          select.classList.add('cx-native-account-enhanced');
          var host = select.parentElement;
          if (!host) return;
          host.classList.add('cx-native-account-host');

          var picker = document.createElement('div');
          picker.className = 'cx-live-account-picker';
          picker.__cxSelect = select;

          var trigger = document.createElement('button');
          trigger.type = 'button';
          trigger.className = 'cx-live-account-trigger';
          trigger.setAttribute('aria-haspopup', 'dialog');
          trigger.setAttribute('aria-expanded', 'false');
          trigger.setAttribute('aria-label', 'Choose active account');

          var mark = document.createElement('span');
          mark.className = 'cx-live-account-mark';
          mark.textContent = '◈';
          var copy = document.createElement('span');
          copy.className = 'cx-live-account-copy';
          var label = document.createElement('span');
          label.className = 'cx-live-account-label';
          label.textContent = 'ACTIVE ACCOUNT';
          var value = document.createElement('span');
          value.className = 'cx-live-account-value';
          var chevron = document.createElement('span');
          chevron.className = 'cx-live-account-chevron';
          chevron.textContent = '⌄';

          copy.append(label, value);
          trigger.append(mark, copy, chevron);
          picker.appendChild(trigger);
          host.appendChild(picker);

          function update() {
            var opt = select.options[select.selectedIndex];
            if (!opt) return;
            var parts = opt.textContent.split(' — ');
            value.textContent = parts[0] || opt.textContent;
            if (parts[1]) {
              var sub = document.createElement('span');
              sub.textContent = ' · ' + parts[1];
              value.appendChild(sub);
            }
            syncVisuals(opt.value);
          }

          trigger.addEventListener('click', function (event) {
            event.preventDefault();
            event.stopPropagation();
            if (picker.classList.contains('is-open')) closeAll();
            else open(picker, trigger, select);
          });
          select.addEventListener('change', update);
          update();
        });
      }

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeAll();
      });

      observer = new MutationObserver(function () { mount(); });
      function start() {
        mount();
        observer.observe(document.body, { childList: true, subtree: true });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
      else start();
    })();
  </script>
