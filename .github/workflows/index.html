<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <title>CAPTRIX FUNDED — Trade Bold. Get Funded.</title>
  <link rel="icon" type="image/png" href="./assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    // Captrix theme bootstrap: prevent a first-paint light/dark flash.
    (function () {
      try {
        var saved = localStorage.getItem('captrix-theme');
        var mode = ['dark', 'light', 'system'].indexOf(saved) !== -1 ? saved : 'dark';
        var effective = mode;
        if (mode === 'system') {
          effective = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = effective;
        document.documentElement.dataset.themeMode = mode;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.dataset.themeMode = 'dark';
      }
    })();
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-bg text-slate-200 antialiased min-h-screen">
  <div id="root"></div>
  <script type="text/babel" src="./js/app.jsx"></script>
</body>
